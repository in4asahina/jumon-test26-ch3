<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>情報Ⅰ・アセンブリ言語プログラミング 十問テスト【練習用】</title>
<style id="app-style">
/* Layout: 旧Excel版「小テスト」シートの列幅・行高をそのまま比率で再現した1枚のグリッド。単一のライトテーマ（Excelと同じ見た目）に固定。 */
:root{
  --sheet-bg:#D7E4BD;   /* シート全体の緑 */
  --head:#EBF1DE;       /* 見出しセル */
  --qcell:#DBEEF4;      /* 問題文・氏名 */
  --time:#CCC1DA;       /* 開始・終了・受験時間 */
  --score:#C6D9F1;      /* 得点 */
  --cell:#FFFFFF;       /* 入力セル */
  --ink:#000000;
  --muted:#4F6228;
  --head-ink:#000000;   /* 見出しセルの文字 */
  --numcell:#EBF1DE;    /* 番号・問題区分 */
  --name-bg:#DBEEF4;    /* 氏名セル */
  --red:#FF0000;
  --line:#000000;
  --pick-bg:#FFF8DC;    /* 選択肢リスト（薄い黄色） */
  --pick-hover:#F6E3A1; /* 選択中の行 */
  --pick-edge:#4F6228;  /* リストの枠（シートの濃い緑） */
  --pick-rule:#EADFB4;
  --btn:#F0F0F0;
  --btn-edge:#7A7A7A;
  --font:"MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
  --mono:"Consolas","Menlo","BIZ UDGothic","MS Gothic",monospace;
  color-scheme:light;
}
[hidden]{display:none!important;}
/* 練習用（用語）＝青、練習用（論理回路・プログラム）＝赤。第2章の練習用ファイルと同じ配色 */
:root.theme-blue{--sheet-bg:#C6D9F1;--head:#558ED5;--head-ink:#FFFFFF;--numcell:#DBEEF3;--qcell:#DBEEF3;--time:#C6D9F1;--score:#C6D9F1;--name-bg:#FFFFFF;--muted:#1F497D;}
:root.theme-purple{--sheet-bg:#CCC0DA;--head:#8064A2;--head-ink:#FFFFFF;--numcell:#E5E0EC;--qcell:#E5E0EC;--time:#E5E0EC;--score:#E5E0EC;--name-bg:#FFFFFF;--muted:#3F3151;}
:root.theme-red{--sheet-bg:#E6B9B8;--head:#C0504D;--head-ink:#FFFFFF;--numcell:#FDE9D9;--qcell:#FDE9D9;--time:#FDE9D9;--score:#FDE9D9;--name-bg:#FFFFFF;--muted:#7F2A28;}
.practice-badge{display:inline-block;margin-right:.6em;padding:0 .5em;background:var(--head);color:var(--head-ink);font-weight:bold;border-radius:2px;}
html,body{background:var(--sheet-bg);color:var(--ink);}
body{margin:0;font-family:var(--font);}
#app-root{padding-inline:16px;padding-block:16px 48px;}
.sheet-outer{container-type:inline-size;overflow-x:auto;padding:3px;}
.sheet{
  --W:min(max(calc(100cqw - 6px),900px),1900px);
  --pt:calc(var(--W) / 1213);
  width:var(--W);
  display:grid;
  /* A B C D EFG HIJKL M N O P Q R AB AC */
  grid-template-columns:8.875fr 4.625fr 6.25fr 8.43fr 25.29fr 42.15fr 12.625fr 16.25fr 11.5fr 6.25fr 30.5fr 22.5fr 15.625fr 20fr;
  grid-template-rows:repeat(4,calc(30*var(--pt))) repeat(10,minmax(calc(32.1*var(--pt)),auto));
  font-size:calc(11*var(--pt));
}
.c{display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line);background:var(--cell);min-width:0;position:relative;}
.thick{box-shadow:0 0 0 calc(1.6*var(--pt)) var(--line);z-index:1;}
.hdr{background:var(--head);color:var(--head-ink);font-size:calc(16*var(--pt));}
.big-hdr{font-size:calc(20*var(--pt));}
input.c,select.c{border:0;border-radius:0;margin:0;padding:0 calc(4*var(--pt));font-family:var(--font);color:var(--ink);width:100%;height:100%;box-sizing:border-box;text-align:center;}
#user{font-size:calc(22*var(--pt));background:var(--cell);}
#name{font-size:calc(20*var(--pt));background:var(--name-bg);}
input.c::placeholder{color:#8a9a6a;font-size:.6em;}
input.c:focus,.pick:focus-visible,.pick[aria-expanded="true"]{outline:calc(2.4*var(--pt)) solid #217346;outline-offset:calc(-2.4*var(--pt));z-index:3;}
.time{background:var(--time);font-size:calc(18*var(--pt));font-variant-numeric:tabular-nums;white-space:nowrap;}
.score-top{background:var(--score);font-size:calc(36*var(--pt));font-variant-numeric:tabular-nums;}
.score-sub{background:var(--score);font-size:calc(18*var(--pt));}
#mainBtn{
  grid-area:1/8/3/11;margin:calc(9*var(--pt)) calc(10*var(--pt)) calc(9*var(--pt)) calc(18*var(--pt));
  font-family:var(--font);font-size:calc(26*var(--pt));color:var(--ink);
  background:linear-gradient(#FCFCFC,var(--btn) 60%,#E1E1E1);border:1px solid var(--btn-edge);border-radius:calc(3*var(--pt));
  box-shadow:inset 0 0 0 1px #FFFFFF;cursor:pointer;white-space:nowrap;
}
#mainBtn:hover{background:linear-gradient(#EAF6FD,#D9F0FC 60%,#BEE6FD);border-color:#3C7FB1;}
#mainBtn:active{background:linear-gradient(#C4E5F6,#98D1EF);}
#mainBtn:focus-visible{outline:2px solid #217346;outline-offset:2px;}
.sheet-title{grid-area:3/3/4/8;display:flex;align-items:center;padding-left:calc(4*var(--pt));font-size:calc(13*var(--pt));color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0;}
#remain{grid-area:3/8/4/11;display:flex;align-items:center;justify-content:center;font-size:calc(15*var(--pt));color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
#remain.warn{color:#C00000;font-weight:bold;}
.cat{background:var(--numcell);font-size:calc(16*var(--pt));text-align:center;line-height:1.5;}
.num{background:var(--numcell);font-size:calc(16*var(--pt));}
.q{background:var(--qcell);justify-content:flex-start;text-align:left;padding:calc(3*var(--pt)) calc(5*var(--pt));font-size:calc(12*var(--pt));line-height:1.35;}
.q .qt{display:block;}
.q pre{margin:calc(3*var(--pt)) 0 0;font-family:var(--mono);font-size:calc(11.5*var(--pt));line-height:1.35;background:rgba(255,255,255,.55);padding:calc(3*var(--pt)) calc(8*var(--pt));white-space:pre;overflow-x:auto;}
.q .qbox{min-width:0;max-width:100%;}
.q.hide .qbox{visibility:hidden;}
.ans{font-size:calc(20*var(--pt));}
.pick{border:0;border-radius:0;margin:0;font-family:var(--font);color:var(--ink);width:100%;height:100%;box-sizing:border-box;white-space:nowrap;overflow:hidden;
  cursor:pointer;text-align:center;padding:0 calc(14*var(--pt)) 0 calc(4*var(--pt));background-color:var(--cell);
  background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);
  background-position:calc(100% - 10*var(--pt)) 55%,calc(100% - 5*var(--pt)) 55%;
  background-size:calc(5*var(--pt)) calc(5*var(--pt));background-repeat:no-repeat;}
button.pick:disabled,input.c:disabled{cursor:default;background-image:none;opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);}
.picklist{position:fixed;z-index:40;background:var(--pick-bg);border:2px solid var(--pick-edge);box-shadow:0 8px 18px rgba(40,50,20,.32);
  padding:4px 0;max-height:60vh;overflow:auto;font-family:var(--font);color:var(--ink);width:max-content;max-width:calc(100vw - 8px);box-sizing:border-box;}
.picklist .opt{padding:.32em 1.1em .32em 1.7em;white-space:nowrap;cursor:pointer;position:relative;line-height:1.3;}
.picklist .opt + .opt{border-top:1px solid var(--pick-rule);}
.picklist .opt.active{background:var(--pick-hover);}
.picklist .opt[aria-selected="true"]::before{content:"✓";position:absolute;left:.45em;color:var(--pick-edge);}
.picklist .opt.clear{color:var(--muted);font-size:.62em;padding-block:.55em;}
.sc{background:var(--score);font-size:calc(20*var(--pt));font-variant-numeric:tabular-nums;}
.sc.ng{color:var(--ink);}
.right{display:flex;align-items:center;padding-left:calc(4*var(--pt));color:var(--red);font-size:calc(20*var(--pt));white-space:nowrap;overflow:visible;gap:calc(8*var(--pt));min-width:0;}
.right small{font-size:.6em;}
.right .pg{color:var(--muted);font-size:.6em;}
.right-hdr{grid-area:4/13/5/15;color:var(--red);}
.status-line{grid-area:3/13/4/15;display:flex;align-items:center;padding-left:calc(6*var(--pt));font-size:calc(12*var(--pt));color:var(--muted);white-space:nowrap;}

.admin-link{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font:12px var(--font);color:var(--muted);background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;cursor:pointer;}
.admin-link:hover,.admin-link:focus-visible{border-color:var(--muted);background:var(--head);}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(30,40,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto;}
.panel{background:#FFFFFF;color:var(--ink);border:1px solid #6b7b4b;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(760px,100%);font:14px/1.6 var(--font);}
.panel h2{margin:0;padding:10px 16px;background:var(--head);border-bottom:1px solid #9bab7b;font-size:16px;}
.panel .bd{padding:14px 16px;display:grid;gap:14px;}
.panel .ft{padding:10px 16px;border-top:1px solid #d5dcc5;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.panel section{display:grid;gap:8px;}
.panel h3{margin:0;font-size:14px;border-left:4px solid #9BBB59;padding-left:8px;}
.panel p{margin:0;}
.panel .note{font-size:12px;color:#555;}
.pbtn{font:14px var(--font);padding:6px 14px;background:linear-gradient(#FCFCFC,#ECECEC);border:1px solid #8a8a8a;border-radius:3px;cursor:pointer;color:var(--ink);}
.pbtn:hover{background:linear-gradient(#EAF6FD,#CFEAFB);border-color:#3C7FB1;}
.pbtn.primary{background:linear-gradient(#5d9a3a,#3f7a22);color:#FFFFFF;border-color:#2f5c19;}
.pbtn.danger{color:#A00000;}
.pbtn:focus-visible{outline:2px solid #217346;outline-offset:2px;}
.panel input[type=password]{font:16px var(--font);padding:6px 8px;border:1px solid #888;width:200px;}
.drop{border:2px dashed #9BBB59;padding:14px;text-align:center;background:#F7FAF0;}
.drop.over{background:#E4EFD0;}
.tbl-wrap{overflow-x:auto;}
table.cnt{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%;}
table.cnt th,table.cnt td{border:1px solid #b9c4a5;padding:3px 8px;text-align:center;white-space:nowrap;}
table.cnt th{background:var(--head);}
table.cnt td.l{text-align:left;}
table.cnt td.zero{color:#C00000;font-weight:bold;}
ul.warn{margin:0;padding-left:20px;font-size:13px;color:#8a2a00;max-height:160px;overflow:auto;}
.msg{white-space:pre-wrap;}
@media (prefers-reduced-motion:no-preference){.modal .panel{animation:pop .12s ease-out;}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app-root">
  <div class="sheet-outer">
    <div class="sheet" id="sheet">
      <div class="c hdr thick" style="grid-area:1/3/2/6">ユーザー名</div>
      <div class="c hdr thick" style="grid-area:1/6/2/8">氏　名</div>
      <input class="c thick" id="user" style="grid-area:2/3/3/6" autocomplete="off" spellcheck="false" placeholder="例：1A01" aria-label="ユーザー名">
      <input class="c thick" id="name" style="grid-area:2/6/3/8" autocomplete="off" spellcheck="false" placeholder="氏名を入力" aria-label="氏名">
      <button type="button" id="mainBtn">テスト開始</button>
      <div class="c time thick" id="tStart" style="grid-area:1/11/2/12"></div>
      <div class="c time thick" id="tEnd" style="grid-area:2/11/3/12"></div>
      <div class="c time thick" id="tDur" style="grid-area:3/11/4/12"></div>
      <div class="c score-top thick" style="grid-area:1/12/3/13"><span id="total"></span></div>
      <div class="c score-sub thick" style="grid-area:3/12/4/13">（10点満点）</div>
      <div class="sheet-title" id="sheetTitle"></div>
      <div id="remain" aria-live="polite"></div>
      <div class="status-line" id="statusLine"></div>
      <div class="c hdr thick" style="grid-area:4/3/5/5">番号</div>
      <div class="c hdr thick" style="grid-area:4/5/5/11">問題</div>
      <div class="c hdr thick" style="grid-area:4/11/5/12">解答欄</div>
      <div class="c hdr thick" style="grid-area:4/12/5/13">得点</div>
      <div class="right right-hdr" id="rightHdr"></div>
      <div class="c cat thick" id="catA" style="grid-area:5/2/11/3">選<br>択<br>問<br>題</div>
      <div class="c cat thick" id="catB" style="grid-area:11/2/15/3">記<br>述<br>問<br>題</div>
    </div>
  </div>
  <button type="button" class="admin-link" id="adminLink">管理</button>
  <div class="picklist" id="pickList" role="listbox" aria-label="選択肢" hidden></div>
  <div class="modal" id="modal" hidden><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
</div>

/* ---------- 問題データ ---------- */
function b64ToStr(b64){
  var bin = atob(b64.replace(/\s+/g,'')), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function strToB64(s){
  var bytes = new TextEncoder().encode(s), out = '', CH = 0x8000;
  for (var i=0;i<bytes.length;i+=CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(out);
}
var bank = null;
try { var raw = $('bank-data').textContent.trim(); if (raw && raw.indexOf('__') !== 0) bank = JSON.parse(b64ToStr(raw)); } catch(e) { bank = null; }
if (!bank) bank = { v:1, title:'十問テスト', settings:{}, genres:{}, items:[], roster:[], source:'(問題なし)' };

function setting(key, def){ var s = bank.settings || {}; return (s[key] === undefined || s[key] === '') ? def : s[key]; }
function mode(){ return bank.mode === 'term' || bank.mode === 'calc' || bank.mode === 'mixp' ? bank.mode : 'main'; }
var MODE_JA = { main:'本番用', term:'練習用（用語問題）', calc:'練習用（プログラミング問題）', mixp:'練習用' };
function timeLimitMs(){ return minutesOf(mode()) * 60000; }
function timerOn(md){

/* 書き出すファイル名：【本番用】十問テスト_単元名.html など */
function fileNameFor(md){

  return name.replace(/[\\/:*?"<>|\s]+/g, '_') + '.html';
}

/* ---------- 採点用の正規化（旧版の LOWER(ASC()) を拡張） ---------- */
function norm(s){
  s = String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/[\s　]+/g,'');
  for (var i=0;i<2;i++) s = s.replace(/([ァ-ヺー])[-‐‑‒–—―−]/g,'$1ー');
  if (kanaInsensitive()) s = s.replace(/[ぁ-ゖ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)+0x60); });
  s = s.replace(/[。．.]+$/,'');
  return s;
}
function sameAnswer(input, answer){
  var a = norm(input), b = norm(answer);
  if (a === '' || b === '') return false;
  var MINUS = /^[−‐‑‒–—―ー]/;
  var na = a.replace(/,/g,'').replace(MINUS,'-'), nb = b.replace(/,/g,'').replace(MINUS,'-');
  var NUM = /^[-+]?\d+(\.\d+)?$/;
  if (NUM.test(na) && NUM.test(nb)) return Number(na) === Number(nb);
  return a === b;
}

/* ---------- 出題（旧「出題」シートの手順を再現） ---------- */
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function eligible(it, type){ return type === 'tf' ? !!(it.tf && (it.tf.o || it.tf.x)) : !!it[type]; }
function patternKey(it){ return it.pt || String((it.fr || it.mc || {}).q || '').replace(/\d+(\.\d+)?/g, '#'); }
function makeQ(it, type){
  var q = { id:it.id, g:it.g, type:type, page:it.p || '' };
  if (type === 'tf') {
    var isO = Math.random() < 0.5;
    if (isO && !it.tf.o) isO = false; if (!isO && !it.tf.x) isO = true;
    q.text = isO ? it.tf.o : it.tf.x; q.answer = isO ? '○' : '×'; q.choices = ['○','×'];
    q.word = it.mc ? it.mc.a : (it.fr ? it.fr.a : '');

    q.text = it.mc.q; q.answer = it.mc.a; q.choices = shuffle(it.mc.c);

/* グループ g の記述問題から、パターンが重ならないように n 問選ぶ */
function fromGroupPatterns(g, n){
    var pool = (bank.items || []).filter(function(it){ return it.fr && it.g === g; }), byPt = {};
    pool.forEach(function(it){ var k = patternKey(it); (byPt[k] = byPt[k] || []).push(it); });
    var keys = shuffle(Object.keys(byPt)), got = [];
    keys.forEach(function(k){ if (got.length < n) got.push(pick(byPt[k])); });
    var rest = shuffle(pool.filter(function(it){ return got.indexOf(it) < 0; }));
    while (got.length < n && rest.length) got.push(rest.shift());
    return got;
}
function drawCalc(){
  var used = {}, out = [];
  fromGroupPatterns(9, 4).concat(fromGroupPatterns(10, 6)).forEach(function(it){ if (!used[it.id]) { used[it.id] = true; out.push(makeQ(it, 'fr')); } });
  while (out.length < 10) out.push(null);
  return out;
}
/* 練習用（アセンブリ言語など）の問題数：「設定」シートで変えられる（合計10問） */
function mixpCounts(){
  var toInt = function(v, d){ var n = parseInt(v, 10); return isFinite(n) ? n : d; };
  var nc = Math.max(0, Math.min(8, toInt(setting('選択問題の数', 5), 5)));
  var n9 = Math.max(0, Math.min(10 - nc, toInt(setting('グループ9から出す記述問題の数', 3), 3)));
  return { choice:nc, g9:n9, g10:10 - nc - n9 };
}
/* 練習用：問1〜は語群（グループ1〜8から重ならないように）、続いてグループ9・10のプログラムを読み取る記述（パターンは重ねない） */
function drawMixp(){
  var items = bank.items || [], used = {}, out = [], cnt = mixpCounts();
  var gs = shuffle([1,2,3,4,5,6,7,8]), usedG = {};
  for (var k = 0; k < gs.length && out.length < cnt.choice; k++){
    var pool = items.filter(function(it){ return it.g === gs[k] && it.mc && !used[it.id]; });
    if (!pool.length) continue;
    var it = pick(pool); used[it.id] = true; usedG[it.g] = true; out.push(makeQ(it, 'mc'));
  }
  while (out.length < cnt.choice){
    var rest = items.filter(function(it){ return it.mc && !used[it.id]; });
    if (!rest.length) { out.push(null); continue; }
    var it2 = pick(rest); used[it2.id] = true; out.push(makeQ(it2, 'mc'));
  }
  fromGroupPatterns(9, cnt.g9).concat(fromGroupPatterns(10, cnt.g10)).forEach(function(it){ if (!used[it.id]) { used[it.id] = true; out.push(makeQ(it, 'fr')); } });
  while (out.length < 10) out.push(null);
  return out;
}
function drawTest(){
  if (mode() === 'calc') return drawCalc();
  if (mode() === 'mixp') return drawMixp();
  var termOnly = mode() === 'term';
  var items = (bank.items || []).filter(function(it){ return !termOnly || (it.mc && it.g >= 1 && it.g <= 8); });
  var g8 = shuffle([1,2,3,4,5,6,7,8]);
  var plan = [
    {type:'tf', g:g8[0]},{type:'tf', g:g8[1]},{type:'tf', g:g8[2]},
    {type:'mc', g:g8[3]},{type:'mc', g:g8[4]},{type:'mc', g:g8[5]},
    {type:'fr', g:g8[6]},{type:'fr', g:g8[7]}
  ].concat((termOnly ? shuffle(g8).slice(0, 2) : shuffle([9,10])).map(function(g){ return {type:'fr', g:g}; }));
  var used = {}, usedG = {}, out = [];
  plan.forEach(function(p){
    var pool = items.filter(function(it){ return it.g === p.g && eligible(it,p.type) && !used[it.id]; });
    if (!pool.length) { // そのグループにない場合は、まだ使っていないグループから
      pool = items.filter(function(it){ return eligible(it,p.type) && !used[it.id] && !usedG[it.g]; });
    }
    if (!pool.length) pool = items.filter(function(it){ return eligible(it,p.type) && !used[it.id]; });
    if (!pool.length) { out.push(null); return; }
    var it = pick(pool); used[it.id] = true; usedG[it.g] = true;
    out.push(makeQ(it, p.type));
  });
  return out;
}

var sheet = $('sheet'), btn = $('mainBtn');

function el(tag, cls, style, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (style) e.setAttribute('style', style); if (text != null) e.textContent = text; return e; }

function layoutCats(){

}
function buildRows(){

    var num = el('div','c num thick','grid-area:'+gr+'/3/'+(gr+1)+'/5', String(i+1));
    var qc = el('div','c q thick'+(state==='ready'?' hide':''),'grid-area:'+gr+'/5/'+(gr+1)+'/11');

/* ---------- 枠からはみ出す文字だけ縮小して表示 ---------- */
var measureCtx = document.createElement('canvas').getContext('2d');
function fitText(elm){
  if (!elm) return;
  elm.style.fontSize = '';
  var text = elm.value;
  if (!text) return;
  var cs = getComputedStyle(elm), base = parseFloat(cs.fontSize);
  measureCtx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + base + 'px ' + cs.fontFamily;
  var w = measureCtx.measureText(text).width;
  var avail = elm.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  if (avail > 0 && w > avail) elm.style.fontSize = Math.max(base * 0.3, Math.floor(base * avail / w * 10) / 10) + 'px';
}
/* テスト名が欄に収まらないときだけ縮める */
function fitTitle(){
  var t = $('sheetTitle'); t.style.fontSize = '';
  var base = parseFloat(getComputedStyle(t).fontSize), size = base;
  while (t.scrollWidth > t.clientWidth + 1 && size > base * 0.5) { size -= base * 0.05; t.style.fontSize = size + 'px'; }
}
/* 正答欄：画面の右端からはみ出すときだけ縮める */
function fitRight(rt){
  rt.style.fontSize = '';
  if (!rt.textContent) return;
  var avail = document.documentElement.clientWidth - rt.getBoundingClientRect().left - 6;
  var base = parseFloat(getComputedStyle(rt).fontSize), size = base;
  while (rt.scrollWidth > avail && size > base * 0.4) { size -= base * 0.05; rt.style.fontSize = size + 'px'; }
}
function fitAll(){ rows.forEach(function(r){ fitText(r.ans); if (r.rt) fitRight(r.rt); }); fitText($('user')); fitText($('name')); fitTitle(); }
var fitPending = false;
window.addEventListener('resize', function(){ if (fitPending) return; fitPending = true; requestAnimationFrame(function(){ fitPending = false; fitAll(); }); });
$('name').addEventListener('input', function(){ fitText(this); });
/* ---------- 選択問題の選択肢リスト（ブラウザ標準のプルダウンは色を変えられない環境があるため自前で表示） ---------- */
var pickList = $('pickList'), pickOwner = null, pickActive = -1;
function makePicker(choices){
  var b = el('button', 'c ans thick pick');
  b.type = 'button';
  b.setAttribute('role', 'combobox'); b.setAttribute('aria-haspopup', 'listbox'); b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', 'pickList');
  b._choices = choices.slice(); b._value = '';
  Object.defineProperty(b, 'value', { get:function(){ return this._value; }, set:function(v){ this._value = v == null ? '' : String(v); this.textContent = this._value; fitText(this); } });
  b.addEventListener('click', function(){ if (pickOwner === b) closePick(); else openPick(b); });
  return b;
}
function openPick(b){
  if (b.disabled) return;
  closePick();
  pickOwner = b; b.setAttribute('aria-expanded', 'true');
  pickList.innerHTML = '';
  var opts = [''].concat(b._choices);
  opts.forEach(function(c, i){
    var o = el('div', 'opt' + (c === '' ? ' clear' : ''), null, c === '' ? '（空欄にもどす）' : c);
    o.setAttribute('role', 'option'); o.id = 'pickOpt' + i;
    o.setAttribute('aria-selected', c === b.value && c !== '' ? 'true' : 'false');
    o.addEventListener('mousedown', function(e){ e.preventDefault(); });

    o.addEventListener('mousemove', function(){ setActive(i); });
    pickList.appendChild(o);
  });
  var base = parseFloat(getComputedStyle(sheet).fontSize) / 11; // 1pt あたりのpx
  pickList.style.fontSize = (20 * base) + 'px';
  pickList.hidden = false;
  var r = b.getBoundingClientRect();
  pickList.style.minWidth = r.width + 'px';
  pickList.style.left = Math.max(4, Math.min(r.left, window.innerWidth - pickList.offsetWidth - 4)) + 'px';
  var below = window.innerHeight - r.bottom, h = pickList.offsetHeight;
  pickList.style.top = (below >= h + 8 || below >= r.top ? r.bottom + 3 : Math.max(4, r.top - h - 3)) + 'px';
  setActive(Math.max(0, opts.indexOf(b.value)));
}
function setActive(i){
  var os = pickList.children; if (!os.length) return;
  pickActive = (i + os.length) % os.length;
  for (var k=0;k<os.length;k++) os[k].classList.toggle('active', k === pickActive);
  pickOwner && pickOwner.setAttribute('aria-activedescendant', 'pickOpt' + pickActive);
  var a = os[pickActive]; if (a.scrollIntoView) a.scrollIntoView({ block:'nearest' });
}
function choosePick(i){
  var b = pickOwner; if (!b) return;
  b.value = i === 0 ? '' : b._choices[i-1];
  closePick(); b.focus();
}
function closePick(){
  if (!pickOwner) return;
  pickOwner.setAttribute('aria-expanded', 'false'); pickOwner.removeAttribute('aria-activedescendant');
  pickOwner = null; pickActive = -1; pickList.hidden = true; pickList.innerHTML = '';
}
document.addEventListener('mousedown', function(e){ if (pickOwner && !pickList.contains(e.target) && e.target !== pickOwner) closePick(); });
window.addEventListener('resize', closePick);
window.addEventListener('scroll', function(e){ if (pickOwner && !pickList.contains(e.target)) closePick(); }, true);
function onAnswerKey(e){
  var t = e.target;
  if (t.classList.contains('pick')) {
    var open = pickOwner === t;
    if (open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(pickActive + 1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); setActive(pickActive - 1); return; }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choosePick(pickActive); return; }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePick(); return; }
      if (e.key === 'Tab') { closePick(); return; }
    } else if (e.key === 'ArrowDown' || e.key === ' ' || (e.altKey && e.key === 'ArrowDown')) { e.preventDefault(); openPick(t); return; }
  }
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {   // 229：日本語入力の確定中
    e.preventDefault();
    var i = rows.findIndex(function(r){ return r.ans === e.target; });
    var next = rows[i+1];
    if (next && !next.ans.disabled) { next.ans.focus(); return; }
    // 最後の解答欄：テスト終了ボタンには移らない（Enterの押しすぎで終了しないように）
    var empty = rows.filter(function(r){ return r.q && !r.ans.disabled && !String(r.ans.value).trim(); })[0];
    // 空欄があればいちばん上の空欄へ、全部うまっていれば問1の解答欄へもどる
    var to = empty || rows.filter(function(r){ return r.q && !r.ans.disabled; })[0];
    if (to && to.ans !== e.target) to.ans.focus();
  }
}
function fmtClock(t){ var d = new Date(t); return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0'); }
function fmtDur(ms){ var s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + '分' + String(s%60).padStart(2,'0') + '秒'; }

function resetView(){
  state = 'ready'; test = [];
  btn.textContent = 'テスト開始'; btn.tabIndex = 0;
  $('tStart').textContent = ''; $('tEnd').textContent = ''; $('tDur').textContent = '';
  $('total').textContent = ''; $('rightHdr').textContent = ''; $('remain').textContent = ''; $('statusLine').textContent = '';
  $('remain').classList.remove('warn');
  $('user').readOnly = false;

  document.documentElement.classList.toggle('theme-purple', md === 'mixp');
  $('sheetTitle').textContent = '';

function startTest(){
  var u = $('user').value.trim();
  if (!u) { dialog('ユーザー名', '試験開始前にユーザー名を入力してください。', [{label:'OK', primary:true}]).then(function(){ $('user').focus(); }); return; }
  if (hasRoster()) {
    var r = lookupName(u);
    if (r) { $('name').value = r.name; fitText($('name')); }
    else { $('name').readOnly = false; if (!$('name').value.trim()) { dialog('ユーザー名', '名簿にないユーザー名です。ユーザー名を確かめるか、氏名を入力してから開始してください。', [{label:'OK', primary:true}]).then(function(){ $('name').focus(); }); return; } }
  }
  if (!(bank.items || []).length) { dialog('問題がありません', '問題が読み込まれていません。右下の「管理」から問題ファイルを読み込んでください。', [{label:'OK', primary:true}]); return; }
  lsSet('jt:user', { user:u, name:$('name').value.trim() });
  test = drawTest();
  state = 'running';
  startAt = Date.now(); endAt = startAt + timeLimitMs();
  $('tStart').textContent = fmtClock(startAt) + ' 開始';
  $('user').readOnly = true; $('name').readOnly = true;
  btn.textContent = 'テスト終了'; btn.tabIndex = -1;
  buildRows();
  tick(); timer = setInterval(tick, 250);
  var first = rows[0] && rows[0].ans; if (first && !first.disabled) first.focus();
}
function tick(){
  if (state !== 'running') return;
  var left = endAt - Date.now();
  if (showTimer()) {
    var limit = Math.round((endAt - startAt)/1000);
    var e = Math.min(limit, Math.max(0, Math.floor((Date.now() - startAt)/1000)));   // 経過時間（カウントアップ）
    var mmss = function(x){ return Math.floor(x/60) + ':' + String(x%60).padStart(2,'0'); };
    $('remain').textContent = '経過 ' + mmss(e) + ' / ' + mmss(limit);
    $('remain').classList.toggle('warn', limit - e <= 60);
  }
  if (left <= 0) finishTest('timeout');
}
function finishTest(reason){
  if (state !== 'running') return;
  state = 'done'; clearInterval(timer); timer = null;
  $('statusLine').textContent = '';
  finishedAt = Math.min(Date.now(), endAt);
  if (reason === 'timeout') finishedAt = endAt;
  closeModal(); closePick();
  var total = 0, detail = [];
  rows.forEach(function(r, i){
    var q = r.q, v = r.ans.value, ok = false;
    r.ans.disabled = true;
    if (q) {
      if (q.type === 'fr') ok = [q.answer].concat(q.alts || []).some(function(a){ return sameAnswer(v, a); });
      else ok = v !== '' && norm(v) === norm(q.answer);
    }
    if (ok) total++;
    r.sc.textContent = ok ? '1' : '0';
    r.rt.textContent = '';
    if (!ok && q) {
      r.rt.appendChild(document.createTextNode(q.answer));
      if (q.type === 'tf' && q.answer === '×' && q.word) r.rt.appendChild(el('small', null, null, '正しくは【' + q.word + '】'));
      if (q.page && showRef()) r.rt.appendChild(el('span', 'pg', null, /^\d+$/.test(q.page) ? '教p.' + q.page : q.page));
    }
    detail.push({ no:i+1, type:q ? q.type : '', id:q ? q.id : '', answer:v, ok:ok });
  });
  rows.forEach(function(r){ fitRight(r.rt); });
  $('total').textContent = total + '点';
  $('rightHdr').textContent = '正答';
  $('tEnd').textContent = fmtClock(finishedAt) + ' 終了';
  $('tDur').textContent = '受験時間 ' + fmtDur(finishedAt - startAt);
  $('remain').textContent = reason === 'timeout' ? '時間切れ' : ''; $('remain').classList.remove('warn');
  btn.textContent = '閉じる'; btn.tabIndex = -1;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // 時間切れのときに入力中のEnterで閉じないように
  saveResult(total, detail);
}

/* ---------- 結果の記録・送信（旧版：共有ドライブへ「ユーザー名(回数).xlsm」で保存） ---------- */
var TYPE_JA = { tf:'○×', mc:'語群', fr:'記述' };
function resultHeader(){
  var h = ['記録日時','テスト名','ユーザー名','氏名','回数','開始','終了','受験時間（秒）','得点'];
  for (var i=1;i<=10;i++) h.push('問'+i+'形式','問'+i+'ID','問'+i+'解答','問'+i+'正誤');
  return h;
}
function saveResult(total, detail){
  var u = $('user').value.trim(), key = 'jt:count:' + testTitle() + ':' + norm(u);
  var n = (lsGet(key, 0) || 0) + 1; lsSet(key, n);
  var d = new Date();
  var stamp = d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + fmtClock(d.getTime());
  var row = [stamp, testTitle(), u, $('name').value.trim(), n, fmtClock(startAt), fmtClock(finishedAt), Math.round((finishedAt-startAt)/1000), total];
  detail.forEach(function(x){ row.push(TYPE_JA[x.type] || '', x.id, x.answer, x.ok ? 1 : 0); });
  var hist = lsGet('jt:results', []); if (!Array.isArray(hist)) hist = []; hist.push(row); lsSet('jt:results', hist.slice(-2000));
  var url = postUrl();
  if (url) {
    $('statusLine').textContent = '結果を送信しています…';
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ header:resultHeader(), row:row }) })
      .then(function(){ $('statusLine').textContent = '結果を送信しました（' + n + '回目）'; })
      .catch(function(){ $('statusLine').textContent = '結果を送信できませんでした。先生に知らせてください。'; });
  } else {
    $('statusLine').textContent = n + '回目の受験';
  }
}

btn.addEventListener('click', function(e){

/* ---------- ダイアログ（alert/confirm の代わり） ---------- */
var modal = $('modal'), panel = $('panel'), modalResolve = null;
function openModal(html){ panel.innerHTML = html; modal.hidden = false; var f = panel.querySelector('[data-autofocus]') || panel.querySelector('button,input'); if (f) f.focus(); }
function closeModal(v){ if (modal.hidden) return; modal.hidden = true; panel.innerHTML = ''; var r = modalResolve; modalResolve = null; if (r) r(v); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dialog(title, msg, buttons){
  return new Promise(function(res){
    if (modalResolve) closeModal();
    var b = buttons.map(function(x, i){ return '<button type="button" class="pbtn' + (x.primary ? ' primary' : '') + '" data-i="' + i + '"' + (x.primary ? ' data-autofocus' : '') + '>' + esc(x.label) + '</button>'; }).join('');
    openModal('<h2>' + esc(title) + '</h2><div class="bd"><p class="msg">' + esc(msg) + '</p></div><div class="ft">' + b + '</div>');
    modalResolve = res;
    panel.querySelectorAll('.ft .pbtn').forEach(function(bt){ bt.addEventListener('click', function(){ closeModal(buttons[+bt.dataset.i].value); }); });
  });
}

var lastWarnings = [];
function countTable(){
  var g = {}, items = bank.items || [];
  items.forEach(function(it){ var k = it.g; g[k] = g[k] || {tf:0, mc:0, fr:0, n:0}; g[k].n++; ['tf','mc','fr'].forEach(function(t){ if (eligible(it,t)) g[k][t]++; }); });
  var need = function(k, t){ k = +k; if (k >= 1 && k <= 8) return true; if (k >= 9) return t === 'fr'; return false; };
  var keys = Object.keys(Object.assign({}, bank.genres, g)).map(Number).sort(function(a,b){ return a-b; });
  var h = '<div class="tbl-wrap"><table class="cnt"><thead><tr><th>グループ</th><th>ジャンル</th><th>○×</th><th>語群</th><th>記述</th><th>問題数</th></tr></thead><tbody>';
  keys.forEach(function(k){
    var c = g[k] || {tf:0, mc:0, fr:0, n:0};

  });

function showAdmin(){
  var hist = lsGet('jt:results', []); if (!Array.isArray(hist)) hist = [];
  var w = (lastWarnings.length ? '<ul class="warn">' + lastWarnings.slice(0,60).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '');

    '<section><h3>いま使っている問題</h3><p>' + esc(testTitle()) + '（' + MODE_JA[mode()] + '）</p><p class="note">読み込み元：' + esc(bank.source || '') + (bank.built ? '（' + esc(bank.built) + '）' : '') + ' ／ 試験時間 ' + (timeLimitMs()/60000) + '分 ／ 名簿 ' + (bank.roster||[]).length + '名 ／ 結果送信 ' + (postUrl() ? 'あり' : 'なし') + '</p>' + countTable() + '<p class="note">赤い数字は、そのグループで必要な形式の問題がないことを示します（その場合は別のグループから出題します）。</p>' + w + '</section>' +
    '<section><h3>制限時間と経過時間の表示</h3><form id="timeForm" style="display:grid;grid-template-columns:auto auto;gap:8px 18px;align-items:center;justify-content:start">' +

    '<section><h3>問題ファイル（Excel）を読み込む</h3><div class="drop" id="drop"><p>問題集のExcelファイル（.xlsx / .xlsm）をここにドロップするか、</p><p><input type="file" id="file" accept=".xlsx,.xlsm,.xls"></p></div><p class="note" id="loadMsg">読み込んだ問題はこの画面にだけ反映されます。生徒に配るには、下の「配布用HTMLを書き出す」を使います。Excelの読み込みにはインターネット接続が必要です。</p></section>' +
    '<section><h3>配布用HTMLを書き出す</h3><p>いまの問題を埋め込んだHTMLファイルを保存します。生徒はこのファイルをブラウザで開くだけで受験できます（インターネット接続は不要）。</p><div style="display:grid;gap:4px;margin-bottom:6px">' + exportModes().map(function(m){ return '<label><input type="radio" name="expMode" value="' + m + '"' + (m === mode() ? ' checked' : '') + '> ' + MODE_JA[m] + '：' + esc(titleFor(m)) + '<br><span class="note">ファイル名：' + esc(fileNameFor(m)) + '</span></label>'; }).join('') + '</div><div><button type="button" class="pbtn primary" id="exportBtn">配布用HTMLを書き出す</button></div><p class="note">' + (mode() === 'mixp' ? '練習用（紫の画面）として書き出します。' + (function(c){ return '問1〜' + c.choice + 'は語群の選択問題（グループ1〜8）、問' + (c.choice + 1) + '〜10はプログラムを読み取る記述問題（グループ9から' + c.g9 + '問、グループ10から' + c.g10 + '問）です。問題数はExcelの「設定」シートで変えられます。'; })(mixpCounts()) : '本番用は緑、練習用（用語問題）は青、練習用（プログラミング問題）は赤の画面になります。練習用（用語問題）は関連用語シートの問題だけ、練習用（プログラミング問題）はグループ9（論理回路）・10（プログラム）の問題だけから出題します。') + '</p><p class="note">保存先を確かめる画面が出たら「保存」を選びます。</p></section>' +
    '<section><h3>この端末の受験記録</h3><p>' + hist.length + ' 件</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="pbtn" id="csvBtn"' + (hist.length ? '' : ' disabled') + '>CSVで保存</button><button type="button" class="pbtn danger" id="clearBtn"' + (hist.length || lsGet('jt:user', null) ? '' : ' disabled') + '>記録を消す</button><button type="button" class="pbtn danger" id="countBtn"' + (countKeys().length ? '' : ' disabled') + '>受験回数をリセット</button></div><p class="note">「記録を消す」は、受験記録と、この端末に覚えているユーザー名・氏名を消します（受験回数は消えません）。</p><p class="note">受験回数（「○回目の受験」）は、この端末に、ユーザー名ごとに数えています。いま ' + countKeys().length + ' 人分あります。リセットすると、全員が次の受験から「1回目」にもどります。</p></section>' +
    '</div><div class="ft"><button type="button" class="pbtn" id="admClose" data-autofocus>閉じる</button></div></div>');
  $('admClose').onclick = function(){ closeModal(); };
  $('timeForm').addEventListener('submit', function(e){
    e.preventDefault();
    var a = $('tMain') ? Math.round(Number($('tMain').value)) : minutesOf('main'), b = Math.round(Number($('tPrac').value));
    if (!(a >= 1 && a <= 180) || !(b >= 1 && b <= 180)) { $('timeMsg').textContent = '1〜180の整数（分）で入力してください。'; return; }
    var va = $('vMain') ? $('vMain').checked : timerOn('main'), vb = $('vPrac').checked;
    bank.settings = Object.assign({}, bank.settings || {}); bank.settings['試験時間（分）'] = String(a); bank.settings['練習用の試験時間（分）'] = String(b);
    bank.settings['経過時間の表示'] = va ? 'する' : 'しない'; bank.settings['練習用の経過時間の表示'] = vb ? 'する' : 'しない';
    showAdmin();
    $('timeMsg').textContent = (mode() === 'mixp' ? '' : '本番用 ' + a + '分（経過時間' + (va ? 'を表示' : 'は非表示') + '）・') + '練習用 ' + b + '分（経過時間' + (vb ? 'を表示' : 'は非表示') + '）に変更しました。この画面ではすぐに使えます。生徒に配るファイルに反映するには、下の「配布用HTMLを書き出す」で保存しなおしてください。';
  });
  $('file').addEventListener('change', function(){ if (this.files[0]) loadExcel(this.files[0]); });
  var drop = $('drop');
  drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) loadExcel(e.dataTransfer.files[0]); });
  $('exportBtn').onclick = function(){ var r = panel.querySelector('input[name=expMode]:checked'); exportHtml(r ? r.value : mode()); };
  $('csvBtn').onclick = function(){ var h = lsGet('jt:results', []); downloadText(toCsv([resultHeader()].concat(h)), testTitle() + '_受験記録.csv', 'text/csv'); };
  $('clearBtn').onclick = function(){
    var b = $('clearBtn');
    if (b.dataset.armed) {
      lsSet('jt:results', []);
      try { localStorage.removeItem('jt:user'); } catch(e) {}      // 覚えているユーザー名・氏名も消す
      if (state === 'ready') { $('user').value = ''; $('name').value = ''; fitText($('user')); fitText($('name')); }
      showAdmin(); $('loadMsg').textContent = '受験記録と、ユーザー名・氏名の記録を消しました。';
    }
    else { b.dataset.armed = '1'; b.textContent = 'もう一度押すと消します'; }
  };
  $('countBtn').onclick = function(){
    var b = $('countBtn');
    if (b.dataset.armed) { countKeys().forEach(function(k){ try { localStorage.removeItem(k); } catch(e) {} }); showAdmin(); $('loadMsg').textContent = '受験回数をリセットしました。'; }
    else { b.dataset.armed = '1'; b.textContent = 'もう一度押すとリセットします'; }
  };
}
function exportModes(){ return mode() === 'mixp' ? ['mixp'] : ['main','term','calc']; }
function countKeys(){
  var out = [], pre = 'jt:count:' + testTitle() + ':';
  try { for (var i=0;i<localStorage.length;i++){ var k = localStorage.key(i); if (k && k.indexOf(pre) === 0) out.push(k); } } catch(e) {}
  return out;
}
function toCsv(rows){ return '﻿' + rows.map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(','); }).join('\r\n'); }
var dlNs = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(function(n){ dlNs = n; }, function(){}); } catch(e) {}
function downloadText(text, name, type){
  if (dlNs) { dlNs.save({ filename:name, data:text }).catch(function(err){ if (!err || err.code !== 'declined') blobDownload(text, name, type); }); return; }
  blobDownload(text, name, type);
}
function blobDownload(text, name, type){
  var blob = new Blob([text], { type:type + ';charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportHtml(md){
  var copy = Object.assign({}, bank); copy.mode = md || mode(); copy.title = titleFor(copy.mode);
  var styleText = $('app-style').textContent, scriptText = $('app-script').textContent;
  var title = esc(copy.title);
  var html = '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>' + title + '</title>\n<style id="app-style">' + styleText + '</style>\n</head>\n<body>\n' + ROOT_HTML +
    '\n<script id="bank-data" type="application/json">' + strToB64(JSON.stringify(copy)) + '<\/script>\n<script id="app-script">' + scriptText + '<\/script>\n</body>\n</html>\n';
  downloadText(html, fileNameFor(copy.mode), 'text/html');
}

/* ---------- Excel 読み込み（旧問題集と同じ列構成） ---------- */
function loadScript(src){ return new Promise(function(res, rej){ if (window.XLSX) return res(); var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('load')); }; document.head.appendChild(s); }); }
function loadExcel(file){
  var msg = $('loadMsg'); msg.textContent = '読み込み中…';
  loadScript(SHEETJS).then(function(){
    return file.arrayBuffer();
  }).then(function(buf){
    var wb = window.XLSX.read(buf, { type:'array' });
    var res = parseWorkbook(wb, file.name);
    var fmt = String((res.bank.settings || {})['出題の形式'] || '');
    var keepMode = fmt.indexOf('練習用') >= 0 ? 'mixp' : (mode() === 'mixp' ? 'main' : mode()); bank = res.bank; bank.mode = keepMode; bank.title = titleFor(keepMode); lastWarnings = res.warnings;
    resetView();
    var u = lsGet('jt:user', null); if (u && !$('user').value) $('user').value = u.user || '';
    showAdmin();
    $('loadMsg').textContent = '「' + file.name + '」から ' + bank.items.length + ' 問を読み込みました。' + (res.warnings.length ? '確認が必要な点が ' + res.warnings.length + ' 件あります（上の一覧）。' : '');
  }).catch(function(err){
    msg.textContent = (err && err.message === 'load') ? 'Excelを読むための部品を読み込めませんでした。インターネットに接続してからもう一度試してください。' : '読み込めませんでした：' + (err && err.message ? err.message : err);
  });
}
function cellVal(ws, r, c){
  var cell = ws[window.XLSX.utils.encode_cell({ r:r, c:c })];
  if (!cell || cell.v == null) return '';
  if (cell.t === 'n') return String(cell.v);
  if (cell.t === 'b') return cell.v ? 'TRUE' : 'FALSE';
  if (cell.t === 'e') return '';
  return String(cell.v).replace(/\r\n?/g,'\n').trim();
}
function fillBlank(q, word){ return BLANK_RE.test(q) ? q.replace(BLANK_RE, '【' + word + '】') : ''; }
function parseWorkbook(wb, name){
  var warnings = [], X = window.XLSX;
  var ws = wb.Sheets['問題リスト'];
  if (!ws) throw new Error('「問題リスト」シートが見つかりません。');
  var genres = {}, codeToG = {};
  var gs = wb.Sheets['ジャンル'];
  if (gs && gs['!ref']) {
    var gr = X.utils.decode_range(gs['!ref']);
    for (var r=1;r<=gr.e.r;r++){ var code = cellVal(gs,r,0), g = parseInt(cellVal(gs,r,1),10); if (code && g) { codeToG[code] = g; genres[g] = cellVal(gs,r,2); } }
  }
  var settings = {};
  var ss = wb.Sheets['設定'];
  if (ss && ss['!ref']) { var sr = X.utils.decode_range(ss['!ref']); for (var r2=1;r2<=sr.e.r;r2++){ var k = cellVal(ss,r2,0); if (k) settings[k] = cellVal(ss,r2,1); } }
  var roster = [];
  var ns = wb.Sheets['名票'] || wb.Sheets['名簿'];
  if (ns && ns['!ref']) { var nr = X.utils.decode_range(ns['!ref']); for (var r3=1;r3<=nr.e.r;r3++){ var user = cellVal(ns,r3,4) || (cellVal(ns,r3,1) + cellVal(ns,r3,2) + cellVal(ns,r3,3)); var nm = cellVal(ns,r3,5); if (user && nm) roster.push({ id:cellVal(ns,r3,0), user:user, name:nm }); } }
  var items = [], range = X.utils.decode_range(ws['!ref']);
  for (var r4=2;r4<=range.e.r;r4++){
    var v = function(c){ return cellVal(ws, r4, c); };
    var code = v(1), I = v(8), P = v(15);
    if (!code && !I && !P) continue;
    var rowNo = r4 + 1, id = v(0) || ('r' + rowNo);
    var g = codeToG[code] || parseInt(v(2),10);
    if (!g) { warnings.push(rowNo + '行目：記号「' + code + '」がジャンルシートにありません（読み飛ばしました）'); continue; }
    var off = function(c){ return v(c) === '99'; };
    var it = { id:id, g:g, code:code, p:v(24), pt:v(26), mc:null, fr:null, tf:null };
    var J = v(9);
    if (I && J && !off(4)) {
      var ch = [10,11,12,13,14].map(v).filter(function(x){ return x && !PLACEHOLDER.test(x); });
      if (ch.indexOf(J) < 0) { warnings.push(rowNo + '行目：語群の正解「' + J + '」が語１〜語５にありません（正解を語群に加えました）'); ch.push(J); }
      if (ch.length < 2) warnings.push(rowNo + '行目：語群が1語しかありません');
      else it.mc = { q:I, a:J, c:ch };
      if (!BLANK_RE.test(I)) warnings.push(rowNo + '行目：語群の問題文に【　　】がありません');
    }
    var Q = v(16);
    if (P && Q && !off(5)) it.fr = { q:P, a:Q, alts:[17,18,19,20,21].map(v).filter(function(x){ return x && !PLACEHOLDER.test(x); }) };
    else if (P && !Q && !off(5)) warnings.push(rowNo + '行目：記述の正解（Q列）が空です');
    var o = off(6) ? '' : (v(22) || (I && J ? fillBlank(I, J) : ''));
    var x = off(7) ? '' : (v(23) || (I && v(25) ? fillBlank(I, v(25)) : ''));
    if (o || x) it.tf = { o:o, x:x };
    if (!it.mc && !it.fr && !it.tf) { warnings.push(rowNo + '行目：出題できる形式がありません'); continue; }
    items.push(it);
  }
  var d = new Date();
  return { warnings:warnings, bank:{ v:1, mode:'main', title:settings['テスト名'] || name.replace(/\.[^.]+$/,''), settings:settings, genres:genres, items:items, roster:roster, source:name, built:d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() } };
}

/* ---------- 起動 ---------- */
resetView();
var saved = lsGet('jt:user', null);
if (saved && saved.user) { $('user').value = saved.user; if (hasRoster()) { var r0 = lookupName(saved.user); $('name').value = r0 ? r0.name : ''; } else $('name').value = saved.name || ''; }
fitAll();
window.__jt = { current:function(){ return test; }, state:function(){ return state; }, fileNameFor:fileNameFor, get bank(){ return bank; }, drawTest:drawTest, sameAnswer:sameAnswer, parseWorkbook:parseWorkbook };
})();
